# H2 in-memory database for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Default datasource for local dev; overridden by SPRING_DATASOURCE_* env vars in Kubernetes
spring.datasource.url=jdbc:h2:mem:produtosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port (matches Dockerfile and k8s manifests)
server.port=8080
